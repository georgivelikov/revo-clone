server:
  port: ${SERVER_PORT:8089}
  shutdown: graceful

spring:
  application:
    name: simulator-service
  lifecycle:
    # docker-compose.yml's stop_grace_period for this service must exceed this value, or Docker
    # SIGKILLs the JVM before the graceful phase completes.
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

revolut:
  simulator:
    fx:
      # Per-tick Gaussian standard deviation, as a fraction of the current mid. 5 bps default -
      # wide enough that a quote's 30s expiry and a rate move between quote and confirm are both
      # reachable in testing, narrow enough the feed still looks like a real rate on screen.
      volatility: ${FX_SIMULATOR_VOLATILITY:0.0005}
      tick-interval-ms: ${FX_SIMULATOR_TICK_INTERVAL_MS:500}
    card:
      # card-service's /internal/cards/{cardId}/pan-for-network - see CardNetworkPanRestClient.
      base-url: ${CARD_BASE_URL}
    chaos:
      # Where POST /simulator/chaos forwards ledger.*/fx.*/outbox.* levers - see
      # ChaosControlPlaneClient. Only meaningful with the chaos profile active.
      ledger-base-url: ${LEDGER_BASE_URL}
      fx-base-url: ${FX_BASE_URL}
      payment-base-url: ${PAYMENT_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
