server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful   # Kafka listener containers finish in-flight records before this JVM exits.

spring:
  application:
    name: notification-service
  lifecycle:
    # docker-compose.yml's stop_grace_period for this service must exceed this value, or Docker
    # SIGKILLs the JVM before the graceful phase completes.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/notification
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        # Cooperative rebalancing: only the partitions actually moving pause during a scale
        # event, instead of every consumer stopping (the default eager protocol's behaviour).
        # See plans/phase-07-resilience-and-scale.md's "Scaling consumers" section.
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  # Without this, a message escalated to <topic>.retry-5s by the shared DefaultErrorHandler
  # never gets relayed back to the main topic - RetryTopicRelay only watches topics it is told
  # about (RetryTopicProperties defaults to empty). See services/card-service/application.yml's
  # fuller comment on this; task 09.4 found the gap empty project-wide.
  messaging:
    retry:
      topics: [account.account.v1, ledger.entry.v1, notification.push.v1, payment.event.v1, fx.rate.tick.v1]
  notifications:
    websocket:
      # The handshake URL. A browser cannot set an Authorization header on a WebSocket
      # handshake, so this endpoint is permitted by the security filter chain and authenticated
      # instead by the single-use ticket in the `ticket` query parameter - see
      # WebSocketTicketStore and TicketHandshakeInterceptor.
      path: ${WS_PATH:/ws}
      # CORS on the WebSocket upgrade is configured separately from HTTP CORS (the gateway owns
      # that one), so the browser origin has to be named here too. Comma-separated.
      allowed-origins: ${WS_ALLOWED_ORIGINS}
    ticket:
      # 30 seconds, per plans/phase-03-payments-and-ui.md: long enough to open a socket,
      # short enough that a leaked ticket is worthless. Single-use as well as short-lived.
      ttl: ${WS_TICKET_TTL:30s}
    feed:
      # How many persisted notifications GET /api/notifications returns.
      page-size: ${NOTIFICATION_FEED_PAGE_SIZE:50}
    rates:
      # ~2/s per plans/phase-04-fx-multicurrency.md task 9 - see RateTickBroadcaster.
      broadcast-delay-ms: ${RATE_BROADCAST_DELAY_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
