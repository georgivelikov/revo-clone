# Local-dev defaults only. Never merged into application.yml - see CLAUDE.md's config-hygiene
# rule; the tripwire checks this by filename.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/notification
    username: notification
    password: notification
  data:
    redis:
      host: 127.0.0.1
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8180/realms/revolut

revolut:
  notifications:
    websocket:
      # Vite's dev server, which is where the browser that opens the socket comes from.
      allowed-origins: http://localhost:5173

logging:
  structured:
    format:
      console:
