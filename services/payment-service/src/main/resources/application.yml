server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful   # Kafka listener containers finish in-flight records before this JVM exits.

spring:
  application:
    name: payment-service
  lifecycle:
    # docker-compose.yml's stop_grace_period for this service must exceed this value, or Docker
    # SIGKILLs the JVM before the graceful phase completes.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        # Cooperative rebalancing: only the partitions actually moving pause during a scale
        # event, instead of every consumer stopping (the default eager protocol's behaviour).
        # See plans/phase-07-resilience-and-scale.md's "Scaling consumers" section.
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  payments:
    # Per-transaction cap in minor units, NOT a balance check - the ledger owns balances and
    # rejects an overdraw with INSUFFICIENT_FUNDS after the fact. See PaymentLimitsProperties.
    max-amount-minor: ${PAYMENT_MAX_AMOUNT_MINOR:10000000}
  payment:
    fx:
      base-url: ${FX_BASE_URL}

resilience4j:
  circuitbreaker:
    instances:
      fx-quote:
        # A cross-currency transfer is synchronous on this one call - see
        # plans/phase-04-fx-multicurrency.md's Variant section. Defaults are otherwise Resilience4j's
        # own; tuned here only where the phase's own reasoning calls for a specific number.
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        # plans/phase-08-load-and-observability.md's Latency row needs p50/p95/p99 for
        # "accept" (this timer) via histogram_quantile() in Grafana - without this, Spring
        # Boot's auto-instrumented http.server.requests only publishes count/sum/max, no
        # bucket series to query percentiles from.
        "[http.server.requests]": true

logging:
  structured:
    format:
      console: logstash
