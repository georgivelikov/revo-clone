# Local-dev defaults only. Never merged into application.yml - see CLAUDE.md's config-hygiene
# rule; the tripwire checks this by filename.
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8180/realms/revolut

revolut:
  gateway:
    cors:
      allowed-origin: http://localhost:5173
    routes:
      identity-service-uri: http://127.0.0.1:8081
      account-service-uri: http://127.0.0.1:8082
      payment-service-uri: http://127.0.0.1:8084
      ledger-service-uri: http://127.0.0.1:8083

logging:
  structured:
    format:
      console:
