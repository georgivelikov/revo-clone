server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${revolut.gateway.routes.identity-service-uri}
              predicates:
                - Path=/api/identity/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: account-service
              uri: ${revolut.gateway.routes.account-service-uri}
              predicates:
                - Path=/api/accounts/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: payment-service
              uri: ${revolut.gateway.routes.payment-service-uri}
              predicates:
                - Path=/api/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: ledger-service
              uri: ${revolut.gateway.routes.ledger-service-uri}
              predicates:
                - Path=/api/ledger/**
              filters:
                - RewritePath=/api/ledger/(?<segment>.*), /internal/ledger/${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: fx-service
              uri: ${revolut.gateway.routes.fx-service-uri}
              predicates:
                - Path=/api/fx/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # Missing since card-service's own first endpoint (task 05.2) - every /api/cards/**
            # call in this phase (issuance, reveal, freeze, limits, the spend feed) was reachable
            # only on card-service's own port 8086 directly until task 05.10's Card screen tried
            # it through the browser and found the gap.
            - id: card-service
              uri: ${revolut.gateway.routes.card-service-uri}
              predicates:
                - Path=/api/cards/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # Missing since analytics-service's own first endpoint (task 06.1) - every
            # /api/analytics/** call in this phase (vault CRUD/transfer, budgets, the query
            # endpoints) was reachable only on analytics-service's own port 8087 directly until
            # task 06.9's Vaults screen tried it through the browser and found the gap.
            - id: analytics-service
              uri: ${revolut.gateway.routes.analytics-service-uri}
              predicates:
                - Path=/api/analytics/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # Only the ticket endpoint and the persisted feed - never /ws itself. The WebSocket
            # handshake is a different mechanism (Origin-checked on notification-service via
            # WS_ALLOWED_ORIGINS, not HTTP CORS) and the browser opens it directly - see
            # web/src/ws/notificationSocket.ts. Routing it through this reactive gateway too
            # would work, but nothing here needs it to, and GatewaySecurityConfig's CORS/JWT
            # filter chain is built for request/response HTTP, not a long-lived upgraded socket.
            - id: notification-service
              uri: ${revolut.gateway.routes.notification-service-uri}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${revolut.gateway.rate-limiter.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${revolut.gateway.rate-limiter.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  gateway:
    cors:
      allowed-origin: ${CORS_ALLOWED_ORIGIN}
    routes:
      identity-service-uri: ${IDENTITY_SERVICE_URI}
      account-service-uri: ${ACCOUNT_SERVICE_URI}
      payment-service-uri: ${PAYMENT_SERVICE_URI}
      ledger-service-uri: ${LEDGER_SERVICE_URI}
      notification-service-uri: ${NOTIFICATION_SERVICE_URI}
      fx-service-uri: ${FX_SERVICE_URI}
      card-service-uri: ${CARD_SERVICE_URI}
      analytics-service-uri: ${ANALYTICS_SERVICE_URI}
    idempotency:
      # Money-moving POSTs the edge idempotency filter guards. Exact paths, not /**: the filter
      # only needs to cover requests a downstream service will actually accept, and Spring's
      # PathPattern does not treat "/api/payments/" as a match for "/api/payments" - neither does
      # payment-service's own mapping, so nothing can slip past by adding a slash.
      paths: ${IDEMPOTENCY_PATHS:/api/payments}
      # 24 h, per plans/phase-03-payments-and-ui.md.
      ttl: ${IDEMPOTENCY_TTL:24h}
      max-key-length: ${IDEMPOTENCY_MAX_KEY_LENGTH:200}
      max-buffered-bytes: ${IDEMPOTENCY_MAX_BUFFERED_BYTES:65536}
    rate-limiter:
      # Per-user token bucket, shared across every route. Overridden down to 1/1 in
      # GatewayRateLimitTest so a two-request burst deterministically exhausts it.
      replenish-rate: ${RATE_LIMITER_REPLENISH_RATE:20}
      burst-capacity: ${RATE_LIMITER_BURST_CAPACITY:40}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
