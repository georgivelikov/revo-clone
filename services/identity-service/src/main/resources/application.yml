server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/identity
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  identity:
    provider: ${IDENTITY_PROVIDER:keycloak}
    keycloak:
      server-url: ${KEYCLOAK_SERVER_URL}
      realm: ${KEYCLOAK_REALM}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      identity-keycloak:
        # Registration is synchronous on the Keycloak Admin API - see
        # plans/phase-07-resilience-and-scale.md's Circuit breakers table. Same deliberate
        # numbers as payment-service's fx-quote breaker; tuned here only where the phase's own
        # reasoning calls for a specific number, defaults otherwise.
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # A duplicate-email rejection is a legitimate outcome, not evidence Keycloak is
        # unhealthy - it must not count toward the failure rate that trips the breaker.
        ignore-exceptions:
          - com.revolutclone.identity.error.DuplicateEmailException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
