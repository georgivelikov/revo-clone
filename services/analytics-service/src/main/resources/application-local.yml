# Local-dev defaults only. Never merged into application.yml - see CLAUDE.md's config-hygiene
# rule; the tripwire checks this by filename.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/analytics
    username: analytics
    password: analytics
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8180/realms/revolut

revolut:
  analytics:
    account:
      base-url: http://127.0.0.1:8082
    payment:
      base-url: http://127.0.0.1:8084

logging:
  structured:
    format:
      console:
