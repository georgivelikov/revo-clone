server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful   # Kafka listener containers finish in-flight records before this JVM exits.

spring:
  application:
    name: analytics-service
  lifecycle:
    # docker-compose.yml's stop_grace_period for this service must exceed this value, or Docker
    # SIGKILLs the JVM before the graceful phase completes.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${ANALYTICS_DB_URL}
    username: ${ANALYTICS_DB_USER}
    password: ${ANALYTICS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/analytics
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        # Cooperative rebalancing: only the partitions actually moving pause during a scale
        # event, instead of every consumer stopping (the default eager protocol's behaviour).
        # See plans/phase-07-resilience-and-scale.md's "Scaling consumers" section.
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  # Without this, a message escalated to <topic>.retry-5s by the shared DefaultErrorHandler
  # never gets relayed back to the main topic - RetryTopicRelay only watches topics it is told
  # about (RetryTopicProperties defaults to empty). See services/card-service/application.yml's
  # fuller comment on this; task 09.4 found the gap empty project-wide. Safe for these two
  # seek-to-beginning projection listeners too: both are already required to be idempotent
  # projections (see docs/spring-boot-4-notes.md's ConsumerSeekAware note) specifically so a
  # replayed or retried message can never corrupt them.
  messaging:
    retry:
      topics: [card.authorization.v1, ledger.entry.v1]
  analytics:
    # Task 06.6: vault creation opens the backing account on account-service, and vault
    # move-in/move-out initiates a transfer on payment-service - this service's only two
    # synchronous edges, both internal, non-JWT endpoints. See VaultAccountOpener/
    # PaymentInitiationClient.
    account:
      base-url: ${ACCOUNT_BASE_URL}
    payment:
      base-url: ${PAYMENT_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
