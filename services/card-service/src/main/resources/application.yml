server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: card-service
  datasource:
    url: ${CARD_DB_URL}
    username: ${CARD_DB_USER}
    password: ${CARD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/card
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: card-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
  card:
    crypto:
      # AES-256 key (pan/cvv at rest) and HMAC-SHA256 key (pan_hash lookup), each a base64-encoded
      # 32-byte value. Never a bare passphrase - see PanCipher/PanHasher and
      # plans/phase-05-cards.md's PAN handling note. Deliberately two separate keys: encryption
      # is reversible, the hash key must not be, so a leak of one must not compromise the other.
      encryption-key: ${CARD_ENCRYPTION_KEY}
      pan-hash-key: ${CARD_PAN_HASH_KEY}
    authorization:
      # plans/phase-05-cards.md: "ledger: HOLD billing amount, 7-day expiry". The hold's timeout is
      # owned by the ledger, not by this service - if card-service never comes back, the funds are
      # released anyway.
      hold-ttl: ${CARD_AUTH_HOLD_TTL:7d}
    limits:
      # plans/phase-05-cards.md's Risks section: "'Daily' means a rolling 24 h or a calendar day in
      # the user's timezone - pick one, write it down, and test the boundary." Rolling, measured back
      # from the decision instant - see CardLimitProperties for the full reasoning and for why the
      # monthly window is a fixed 30 days rather than a calendar month. The observable consequence:
      # spend leaves a window gradually, not all at once at midnight.
      daily-window: ${CARD_LIMIT_DAILY_WINDOW:24h}
      monthly-window: ${CARD_LIMIT_MONTHLY_WINDOW:30d}
    fx:
      base-url: ${FX_BASE_URL}
      # plans/phase-05-cards.md task 5: "the card mark-up applied separately from the exchange
      # spread". The exchange spread is fx-service's (revolut.fx.quote.spread-bps) and is applied to
      # the rate; this is card-service's own charge and is applied to the converted amount. Two
      # numbers in two services, so neither can quietly absorb the other - see CardFxProperties.
      mark-up-bps: ${CARD_FX_MARK_UP_BPS:100}
    ledger:
      base-url: ${LEDGER_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
