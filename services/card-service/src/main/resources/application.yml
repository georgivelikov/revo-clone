server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful   # Kafka listener containers finish in-flight records before this JVM exits.

spring:
  application:
    name: card-service
  lifecycle:
    # docker-compose.yml's stop_grace_period for this service must exceed this value, or Docker
    # SIGKILLs the JVM before the graceful phase completes.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${CARD_DB_URL}
    username: ${CARD_DB_USER}
    password: ${CARD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never raise this.
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/card
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: card-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        # Cooperative rebalancing: only the partitions actually moving pause during a scale
        # event, instead of every consumer stopping (the default eager protocol's behaviour).
        # See plans/phase-07-resilience-and-scale.md's "Scaling consumers" section.
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          # Decoupled from issuer-uri above on purpose (task 09.6): the `iss` string a browser
          # login produces is reachable from a browser, not from this container. See
          # docker-compose.infra.yml's KC_HOSTNAME comment for the full story.
          # Empty fallback, not a bare ${OIDC_JWK_SET_URI}: JwkSetUriCondition itself resolves this
          # property while deciding whether to match, so an unset var throws PlaceholderResolutionException
          # at context-refresh time rather than reading as "absent" - same trap as the service-account
          # properties below. Empty resolves cleanly to "not configured", and Boot falls back to the
          # issuer-uri-based decoder, which is what every test here sets instead.
          jwk-set-uri: ${OIDC_JWK_SET_URI:}

revolut:
  security:
    roles-claim: ${ROLES_CLAIM:realm_access.roles}
    # A client-credentials identity for the one call this service makes with no live user JWT
    # on the thread: LedgerReservationsRestClient's hold/settle/release/expire, decided from a
    # Kafka consumer. Reuses the realm's existing confidential `revolut-backend` client
    # (already provisioned for identity-service's Keycloak admin calls) rather than minting a
    # new one - see ServiceAccountTokenProvider's javadoc (platform/common-security, task 09.4).
    service-account:
      # Empty fallbacks, not left bare: @ConditionalOnProperty resolves this exact property's
      # value eagerly (SecurityAutoConfiguration#serviceAccountTokenProvider), and a bare
      # ${KEYCLOAK_ADMIN_CLIENT_ID} with no env var set (every unit/slice test here - none sets
      # Keycloak env vars) throws PlaceholderResolutionException at that resolution, not a clean
      # "property absent" - which fails EVERY test's context load, not just this bean's. Found
      # live, task 09.4, 98 card-service test errors from one unguarded placeholder.
      token-uri: ${KEYCLOAK_SERVER_URL:}/realms/${KEYCLOAK_REALM:}/protocol/openid-connect/token
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  # Without this, a message escalated to <topic>.retry-5s by the shared DefaultErrorHandler
  # (common-messaging's KafkaErrorHandlingConfig) sits there forever: RetryTopicRelay only
  # relays topics it is told about (RetryTopicProperties defaults to empty on purpose - see its
  # own javadoc), and nothing escalates it for a consumer that was never configured. Found live,
  # task 09.4: every one of this service's three consumers hit this, including a genuinely
  # transient one (a brand-new account's funding_account read-model row racing the first
  # authorization against it) - account.account.v1, card.authorization.v1 and ledger.entry.v1
  # all need to be named here, matching the topics CardAuthorizationKafkaListener,
  # AccountKafkaListener and LedgerEntryKafkaListener actually consume.
  messaging:
    retry:
      topics: [account.account.v1, card.authorization.v1, ledger.entry.v1]
  card:
    crypto:
      # AES-256 key (pan/cvv at rest) and HMAC-SHA256 key (pan_hash lookup), each a base64-encoded
      # 32-byte value. Never a bare passphrase - see PanCipher/PanHasher and
      # plans/phase-05-cards.md's PAN handling note. Deliberately two separate keys: encryption
      # is reversible, the hash key must not be, so a leak of one must not compromise the other.
      encryption-key: ${CARD_ENCRYPTION_KEY}
      pan-hash-key: ${CARD_PAN_HASH_KEY}
    authorization:
      # plans/phase-05-cards.md: "ledger: HOLD billing amount, 7-day expiry". The hold's timeout is
      # owned by the ledger, not by this service - if card-service never comes back, the funds are
      # released anyway.
      hold-ttl: ${CARD_AUTH_HOLD_TTL:7d}
    limits:
      # plans/phase-05-cards.md's Risks section: "'Daily' means a rolling 24 h or a calendar day in
      # the user's timezone - pick one, write it down, and test the boundary." Rolling, measured back
      # from the decision instant - see CardLimitProperties for the full reasoning and for why the
      # monthly window is a fixed 30 days rather than a calendar month. The observable consequence:
      # spend leaves a window gradually, not all at once at midnight.
      daily-window: ${CARD_LIMIT_DAILY_WINDOW:24h}
      monthly-window: ${CARD_LIMIT_MONTHLY_WINDOW:30d}
    fx:
      base-url: ${FX_BASE_URL}
      # plans/phase-05-cards.md task 5: "the card mark-up applied separately from the exchange
      # spread". The exchange spread is fx-service's (revolut.fx.quote.spread-bps) and is applied to
      # the rate; this is card-service's own charge and is applied to the converted amount. Two
      # numbers in two services, so neither can quietly absorb the other - see CardFxProperties.
      mark-up-bps: ${CARD_FX_MARK_UP_BPS:100}
    ledger:
      base-url: ${LEDGER_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
