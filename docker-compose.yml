# The application services, behind a `services` profile so `docker-compose.infra.yml` alone
# stays the default local-dev workflow (services run from the IDE / `mvn spring-boot:run`
# against it — see that file's own header comment). Run both files together so they share one
# Compose project and network, and pass the profile explicitly:
#
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml --profile services up -d
#
# Two separate `docker compose -f ... up` invocations (one per file) would create two
# unrelated projects on two different default networks, and the services below would not be
# able to resolve `postgres`/`kafka`/`redis`/`keycloak` by name. Passing both `-f` flags to one
# invocation merges them into a single project instead.
#
# Minimal Dockerfiles for now (see each service's own Dockerfile) — the real multi-stage
# layered build is plans/phase-09-polish.md task 09.1.

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: revolut-api-gateway
    profiles: ["services"]
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
      IDENTITY_SERVICE_URI: http://identity-service:8081
      ACCOUNT_SERVICE_URI: http://account-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8084
      LEDGER_SERVICE_URI: http://ledger-service:8083
      # Only the ticket endpoint and the persisted feed go through this route - the WebSocket
      # handshake itself bypasses the gateway on purpose (see application.yml's route comment),
      # which is also why notification-service isn't in this depends_on list below.
      NOTIFICATION_SERVICE_URI: http://notification-service:8088
      FX_SERVICE_URI: http://fx-service:8085
      CORS_ALLOWED_ORIGIN: http://127.0.0.1:5173
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      # eclipse-temurin:*-jre has neither curl nor wget; bash (present) has a built-in
      # /dev/tcp, which is enough for a minimal HTTP GET without installing anything.
      # /bin/sh is dash here (no /dev/tcp support), so invoke bash explicitly rather than
      # relying on CMD-SHELL's implicit `/bin/sh -c`.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: revolut-identity-service
    profiles: ["services"]
    ports:
      - "8081:8081"
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: identity
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: revolut
      KEYCLOAK_ADMIN_CLIENT_ID: revolut-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: revolut-backend-local-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: revolut-account-service
    profiles: ["services"]
    ports:
      - "8082:8082"
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account
      ACCOUNT_DB_USER: account
      ACCOUNT_DB_PASSWORD: account
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: revolut-payment-service
    profiles: ["services"]
    ports:
      - "8084:8084"
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment
      PAYMENT_DB_USER: payment
      PAYMENT_DB_PASSWORD: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: revolut-notification-service
    profiles: ["services"]
    ports:
      - "8088:8088"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification
      NOTIFICATION_DB_USER: notification
      NOTIFICATION_DB_PASSWORD: notification
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
      # The WebSocket upgrade's CORS check is separate from HTTP CORS (the gateway's
      # CORS_ALLOWED_ORIGIN, above, covers HTTP only) - the browser connects here directly for
      # /ws rather than through the gateway, so the allowed origin has to be repeated here.
      WS_ALLOWED_ORIGINS: http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  simulator-service:
    build:
      context: .
      dockerfile: services/simulator-service/Dockerfile
    container_name: revolut-simulator-service
    profiles: ["services"]
    ports:
      - "8089:8089"
    environment:
      # No database entries here - simulator-service owns no database, see docs/architecture.md.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # The card network's one synchronous hop, task 05.8: GET /internal/cards/{id}/pan-for-network.
      CARD_BASE_URL: ${CARD_BASE_URL:-http://card-service:8086}
    depends_on:
      kafka:
        condition: service_healthy
      card-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Phase 02 built ledger-service but never gave it a compose entry (task 03.12's own note);
  # phase 04's cross-service work (fx-service's synchronous reservation hop, task 04.11's own
  # seed script funding wallets through it) is what actually needed it reachable by every other
  # container rather than only from the IDE, so it is filled in here.
  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: revolut-ledger-service
    profiles: ["services"]
    ports:
      - "8083:8083"
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fx-service:
    build:
      context: .
      dockerfile: services/fx-service/Dockerfile
    container_name: revolut-fx-service
    profiles: ["services"]
    ports:
      - "8085:8085"
    environment:
      FX_DB_URL: jdbc:postgresql://postgres:5432/fx
      FX_DB_USER: fx
      FX_DB_PASSWORD: fx
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
      # Quoting reserves the sell amount on the caller's wallet, which is a synchronous call to the
      # ledger - the one hop fx-service cannot make through the outbox. See LedgerReservations.
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://ledger-service:8083}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  card-service:
    build:
      context: .
      dockerfile: services/card-service/Dockerfile
    container_name: revolut-card-service
    profiles: ["services"]
    ports:
      - "8086:8086"
    environment:
      CARD_DB_URL: jdbc:postgresql://postgres:5432/card
      CARD_DB_USER: card
      CARD_DB_PASSWORD: card
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OIDC_ISSUER_URI: http://keycloak:8080/realms/revolut
      # Fixed, publicly-known 32-byte test keys, base64-encoded - local/demo stack only. See
      # application-local.yml and plans/phase-05-cards.md's PAN handling note.
      CARD_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      CARD_PAN_HASH_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # An authorization holds funds on the card's wallet, which is a synchronous call to the ledger -
      # the one hop the decision cannot make through the outbox, because the network is waiting for the
      # answer. See LedgerReservations.
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://ledger-service:8083}
      # A foreign-currency merchant needs a rate before the amount to hold is even known, so this is
      # the second synchronous hop in the same decision. fx-service answers it out of its in-memory
      # rate cache. See CardFxRates.
      FX_BASE_URL: ${FX_BASE_URL:-http://fx-service:8085}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Vite inlines VITE_* variables into the static bundle at build time (see web/Dockerfile), so
  # they are build args here rather than `environment:` - a browser loading the built bundle
  # has no container DNS, so these point at the same 127.0.0.1 host ports every other service
  # in this file already uses for its own browser-facing origin (CORS_ALLOWED_ORIGIN above).
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: http://127.0.0.1:8180/realms/revolut
        VITE_OIDC_CLIENT_ID: revolut-web
        VITE_API_BASE_URL: http://127.0.0.1:8080
        VITE_NOTIFICATION_BASE_URL: http://127.0.0.1:8088
    container_name: revolut-web
    profiles: ["services"]
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
