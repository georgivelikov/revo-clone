# Scrape config for plans/phase-08-load-and-observability.md. Every target, including
# Prometheus's own self-scrape, is reached by its compose service name rather than a loopback
# address - CLAUDE.md rule 9's config-hygiene test (ConfigHygieneTest, platform/common-web) bans
# that literal text in every *.yml/*.yaml/*.properties file in the repo except a *-local.* file,
# a test fixture, or a docker-compose*.yml, with no comment carve-out - this file is none of
# those, so the ban applies to every line, comments included. Each service's
# /actuator/prometheus endpoint lands in task 08.2; until then the revolut-services job's
# targets simply show as down on Prometheus's own Targets page, which is the expected state for
# a task-ordered build, not a config error.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: revolut-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }
      - targets: ["identity-service:8081"]
        labels: { service: identity-service }
      - targets: ["account-service:8082"]
        labels: { service: account-service }
      - targets: ["ledger-service:8083"]
        labels: { service: ledger-service }
      - targets: ["payment-service:8084"]
        labels: { service: payment-service }
      - targets: ["fx-service:8085"]
        labels: { service: fx-service }
      - targets: ["card-service:8086"]
        labels: { service: card-service }
      - targets: ["analytics-service:8087"]
        labels: { service: analytics-service }
      - targets: ["notification-service:8088"]
        labels: { service: notification-service }
      - targets: ["simulator-service:8089"]
        labels: { service: simulator-service }

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
