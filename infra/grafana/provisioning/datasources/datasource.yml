# Provisioned at container start - deleting Grafana's volume and restarting reproduces the
# same datasource, which is the whole point of "provisioned, not just in Grafana's local
# state" from plans/phase-08-load-and-observability.md's Done when.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed rather than auto-generated: task 08.4's dashboard JSON references this UID
    # directly, and an auto-generated one is not stable across a wiped Grafana volume -
    # which would defeat "provisioned, not just in Grafana's local state".
    uid: revolut-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
