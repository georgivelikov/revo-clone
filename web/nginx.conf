# react-router-dom's BrowserRouter (see src/main.tsx) needs every unmatched path to fall back
# to index.html so client-side routing can take over - otherwise a direct load of e.g.
# /activity/<id> 404s at the web server instead of ever reaching the SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
