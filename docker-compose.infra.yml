# Infra only — Postgres, Kafka, Kafka UI, Redis, Keycloak. No application services here, so
# services can be run from the IDE (or `mvn spring-boot:run`) against this stack directly.
# Bring it up with `docker compose -f docker-compose.infra.yml up -d` (or `tasks.ps1 up`, once
# task 00.12 lands). Ports match the map in CLAUDE.md.

services:
  postgres:
    image: postgres:17
    container_name: revolut-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft single-node broker (no ZooKeeper). Two listeners: PLAINTEXT for other containers on
  # the compose network, PLAINTEXT_HOST for anything on the developer's machine (Kafka UI,
  # tasks.ps1 topics, an IDE-run service). auto.create.topics.enable is deliberately false —
  # every topic is declared by infra/kafka/create-topics.sh from the phase's topic catalogue.
  kafka:
    image: apache/kafka:3.9.0
    container_name: revolut-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # /opt/kafka/bin isn't on this image's PATH by default, so a bare `docker exec revolut-kafka
      # kafka-topics.sh ...` (as agent/phase-verify.ps1 - read-only, cannot be edited - runs)
      # fails with "executable file not found in $PATH". `docker exec` inherits a container's
      # configured environment, so extending PATH here fixes every such bare invocation without
      # touching the protected script. Found live in task 01.7's phase-closing verification.
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: revolut-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: revolut
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: revolut-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # start-dev is for local development only; --import-realm re-imports on every fresh volume
  # (see plans/phase-00-foundations.md §Risks — it only imports on first start against an empty
  # database, hence tasks.ps1's `reset` command dropping the volume). The realm export itself
  # lands in task 00.11 under infra/keycloak/ — nothing to import until then.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: revolut-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
  kafka_data:
  keycloak_data:
