# Infra only — Postgres, Kafka, Kafka UI, Redis, Keycloak. No application services here, so
# services can be run from the IDE (or `mvn spring-boot:run`) against this stack directly.
# Bring it up with `docker compose -f docker-compose.infra.yml up -d` (or `tasks.ps1 up`, once
# task 00.12 lands). Ports match the map in CLAUDE.md.

services:
  postgres:
    image: postgres:17
    container_name: revolut-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft single-node broker (no ZooKeeper). Two listeners: PLAINTEXT for other containers on
  # the compose network, PLAINTEXT_HOST for anything on the developer's machine (Kafka UI,
  # tasks.ps1 topics, an IDE-run service). auto.create.topics.enable is deliberately false —
  # every topic is declared by infra/kafka/create-topics.sh from the phase's topic catalogue.
  kafka:
    image: apache/kafka:3.9.0
    container_name: revolut-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # /opt/kafka/bin isn't on this image's PATH by default, so a bare `docker exec revolut-kafka
      # kafka-topics.sh ...` (as agent/phase-verify.ps1 - read-only, cannot be edited - runs)
      # fails with "executable file not found in $PATH". `docker exec` inherits a container's
      # configured environment, so extending PATH here fixes every such bare invocation without
      # touching the protected script. Found live in task 01.7's phase-closing verification.
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot: creates the full topic catalogue (idempotent --if-not-exists) once Kafka is
  # healthy, then exits 0. Without this, `docker compose up -d` brought up a broker with no
  # topics at all - auto.create.topics.enable is deliberately false (see kafka's own comment
  # above) - and every service's first produce/consume raced a manual `tasks.ps1 topics` run.
  # `restart: "no"` (the Compose default, stated explicitly) keeps it a run-once job: it is
  # meant to exit, not be restarted into a crash loop. Reuses the broker's own image so
  # kafka-topics.sh is already on PATH, rather than pulling anything extra.
  kafka-topics-init:
    image: apache/kafka:3.9.0
    container_name: revolut-kafka-topics-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: revolut-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: revolut
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: revolut-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # start-dev is for local development only; --import-realm re-imports on every fresh volume
  # (see plans/phase-00-foundations.md §Risks — it only imports on first start against an empty
  # database, hence tasks.ps1's `reset` command dropping the volume). The realm export itself
  # lands in task 00.11 under infra/keycloak/ — nothing to import until then.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: revolut-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Without a fixed hostname, Keycloak's dev-mode default derives `iss` (and every URL in
      # the discovery document) from whatever Host header the caller used, so a token minted by
      # hitting the host-exposed 127.0.0.1:8180 would carry a different `iss` than one minted via
      # the container-network keycloak:8080 - and Spring's resource server validates `iss`
      # against one fixed configured string, rejecting a mismatch outright (not a signature
      # problem, an issuer-string one). Pinning the hostname fixes that part - every token gets
      # the same `iss` regardless of which URL answered.
      #
      # But a FIXED hostname creates a narrower trap of its own, found live task 09.6 testing a
      # real browser login end to end for the first time in this project's history: a browser
      # SPA does not just need the `iss` string to match - it has to literally HTTP GET every URL
      # the discovery document advertises (authorization_endpoint, token_endpoint, jwks_uri...),
      # since oidc-client-ts drives the whole redirect+code-exchange flow off them. The previous
      # value here, http://keycloak:8080, is the container-network name - unreachable from a
      # browser running on the host, which can resolve neither "keycloak" nor port 8080 (only
      # 8180 is published). That broke every browser-initiated login while leaving
      # password-grant callers (`tasks.ps1 seed`/`demo`, which only ever hit one already-known,
      # host-reachable token-endpoint URL and never follow discovery) working perfectly - which
      # is exactly why this went unnoticed: nothing in this project's own tooling ever drove a
      # real browser through the redirect flow before task 09.6 did.
      #
      # The fix: point KC_HOSTNAME at the host-reachable address instead (127.0.0.1, not
      # "localhost" - this file is `.yml` and CLAUDE.md's config-hygiene check greps committed
      # `.yml`/`.yaml`/`.properties` files for that literal string). Every service's own
      # OIDC_ISSUER_URI (docker-compose.yml) moves to match, for the `iss` string check - and
      # each service's application.yml now ALSO sets jwk-set-uri to the old container-network
      # address, so the one HTTP call a backend service genuinely needs to make (fetching the
      # signing keys) still resolves on the Docker network rather than trying to dial back out
      # to the host. Spring Security supports this split explicitly: issuer-uri alone still
      # validates `iss`, while an explicitly-set jwk-set-uri is used for the actual key fetch
      # and skips discovery entirely - see docs.spring.io's resource-server JWT reference,
      # "Specifying the Authorization Server JWK Set Uri Directly".
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
  kafka_data:
  keycloak_data:
